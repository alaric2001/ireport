<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IReport — Platform Pelaporan Infrastruktur Publik</title>
  <meta name="description" content="IReport: sistem pelaporan infrastruktur publik berbasis Laravel 10 & PHP 8.2." />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="#" class="nav-brand">
        <i class="fa-solid fa-triangle-exclamation nav-logo-icon"></i>
        <span class="nav-brand-name">IReport</span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="nav-menu" id="navMenu">
        <ul class="nav-links">
          <li><a href="#" class="nav-link active">HOME</a></li>
          <li><a href="#" class="nav-link">BERITA</a></li>
          <li><a href="#" class="nav-link">TIM</a></li>
        </ul>
        <div class="nav-actions">
          <a href="docs.html" class="btn-docs">
            <i class="fa-solid fa-book"></i> Dokumentasi
          </a>
          <a href="https://github.com/alaric2001" target="_blank" class="btn-github" title="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="content-wrapper">

      <!-- DEMO NOTICE -->
      <div class="demo-notice">
        <i class="fa-solid fa-circle-info"></i>
        Ini adalah tampilan demo statis IReport. Data laporan menggunakan contoh dari JSON.
        <a href="docs.html">Lihat dokumentasi teknis →</a>
      </div>

      <!-- SEARCH + FILTER BAR -->
      <div class="search-bar">
        <div class="search-input-wrap">
          <i class="fa-solid fa-search search-icon"></i>
          <input class="search-input" type="search" placeholder="Cari laporan..." disabled />
        </div>
        <div class="filter-wrap">
          <button class="btn-filter" disabled>
            <i class="fa-solid fa-filter"></i> Filter Provinsi
            <i class="fa-solid fa-chevron-down" style="font-size:.7rem;margin-left:2px"></i>
          </button>
          <a href="#" class="btn-new-report">
            <i class="fa-solid fa-plus"></i> Laporan Baru
          </a>
        </div>
      </div>

      <!-- LAPORAN COUNT -->
      <div id="laporan-count" class="laporan-count"></div>

      <!-- LAPORAN GRID -->
      <div class="laporan-grid" id="laporan-container"></div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <i class="fa-solid fa-triangle-exclamation"></i> IReport
      </div>
      <p class="footer-text">Fullstack Laravel 10 Portfolio &middot; Tim 5 Mahasiswa</p>
      <div class="footer-links">
        <a href="docs.html">Dokumentasi Teknis</a>
        <a href="https://github.com/alaric2001" target="_blank">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
