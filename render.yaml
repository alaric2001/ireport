services:
  - type: web
    name: ireport
    env: docker
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: IReport
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://ireport.onrender.com   # ganti setelah deploy
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ireport-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ireport-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ireport-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ireport-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ireport-db
          property: password
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_DRIVER
        value: array
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: ireport-db
    databaseName: ireport
    plan: free
